openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Wozzer social network API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: onboarding
    description: Onboarding interview flow
  - name: users
    description: User profiles
  - name: posts
    description: Feed posts
  - name: follows
    description: Follow system
  - name: feed
    description: Feed and suggestions
  - name: discover
    description: Swipe deck discovery

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/username:
    post:
      operationId: setUsername
      tags: [auth]
      summary: Set username for new OAuth user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUsernameInput"
      responses:
        "200":
          description: Username set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Onboarding
  /onboarding/start:
    post:
      operationId: startOnboarding
      tags: [onboarding]
      summary: Start onboarding — choose path (visionary or wozniak)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStartInput"
      responses:
        "200":
          description: Onboarding started, returns first AI message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"

  /onboarding/chat:
    post:
      operationId: onboardingChat
      tags: [onboarding]
      summary: Send a message in the onboarding AI interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingChatInput"
      responses:
        "200":
          description: AI reply and updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Finalize onboarding and unlock the feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCompleteInput"
      responses:
        "200":
          description: Onboarding complete, returns user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /onboarding/wozniak/skills:
    post:
      operationId: submitWozniakSkills
      tags: [onboarding]
      summary: Submit skills for wozniak path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WozniakSkillsInput"
      responses:
        "200":
          description: Technical challenge returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WozniakChallenge"

  /onboarding/wozniak/challenge:
    post:
      operationId: submitWozniakChallenge
      tags: [onboarding]
      summary: Submit wozniak challenge answer for level assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WozniakChallengeInput"
      responses:
        "200":
          description: Challenge result with assigned level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WozniakChallengeResult"

  # Discover (swipe deck)
  /discover:
    get:
      operationId: getDiscoverDeck
      tags: [discover]
      summary: Get a mixed deck of person + project cards for swiping
      responses:
        "200":
          description: Card deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverDeck"

  /discover/swipe:
    post:
      operationId: recordSwipe
      tags: [discover]
      summary: Record a swipe action on a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeInput"
      responses:
        "200":
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Users / Profiles
  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's public profile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/posts:
    get:
      operationId: listUserPosts
      tags: [users]
      summary: Get posts by a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User posts paginated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"

  /users/me/profile:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Posts
  /posts:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get chronological feed for current user
      parameters:
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Feed posts paginated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{postId}:
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Follows
  /follows/{username}:
    post:
      operationId: followUser
      tags: [follows]
      summary: Follow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Now following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: unfollowUser
      tags: [follows]
      summary: Unfollow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /follows/{username}/status:
    get:
      operationId: getFollowStatus
      tags: [follows]
      summary: Check if current user follows a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"

  # Feed
  /feed/suggested:
    get:
      operationId: getSuggestedUsers
      tags: [feed]
      summary: Get suggested users to follow
      responses:
        "200":
          description: Suggested users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    SetUsernameInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30

    User:
      type: object
      required: [id, username, email, displayName, role, level, onboardingComplete, followersCount, followingCount, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [visionary, wozniak, null]
        level:
          type: ["string", "null"]
          enum: [beginner, intermediate, advanced, null]
        skills:
          type: array
          items:
            type: string
        projectLinks:
          type: array
          items:
            type: string
        onboardingComplete:
          type: boolean
        followersCount:
          type: integer
        followingCount:
          type: integer
        createdAt:
          type: string

    UserProfile:
      type: object
      required: [id, username, displayName, role, level, followersCount, followingCount, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [visionary, wozniak, null]
        level:
          type: ["string", "null"]
          enum: [beginner, intermediate, advanced, null]
        skills:
          type: array
          items:
            type: string
        projectLinks:
          type: array
          items:
            type: string
        followersCount:
          type: integer
        followingCount:
          type: integer
        createdAt:
          type: string
        matchScore:
          type: ["number", "null"]

    ProfileUpdate:
      type: object
      properties:
        bio:
          type: string
        displayName:
          type: string
        projectLinks:
          type: array
          items:
            type: string

    OnboardingStartInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
          enum: [visionary, wozniak]

    OnboardingChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string

    OnboardingCompleteInput:
      type: object
      required: [summary]
      properties:
        summary:
          type: string

    OnboardingState:
      type: object
      required: [sessionId, messages, phase, isComplete]
      properties:
        sessionId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        phase:
          type: string
          enum: [interview, homework, complete]
        isComplete:
          type: boolean
        homeworkQuestions:
          type: array
          items:
            type: string
        summary:
          type: ["string", "null"]

    ChatMessage:
      type: object
      required: [role, content, timestamp]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string

    WozniakSkillsInput:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            type: string
          minItems: 1

    WozniakChallenge:
      type: object
      required: [challengeId, skill, prompt]
      properties:
        challengeId:
          type: string
        skill:
          type: string
        prompt:
          type: string

    WozniakChallengeInput:
      type: object
      required: [challengeId, answer]
      properties:
        challengeId:
          type: string
        answer:
          type: string

    WozniakChallengeResult:
      type: object
      required: [level, feedback]
      properties:
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        feedback:
          type: string

    DiscoverCard:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [person, project]
        person:
          $ref: "#/components/schemas/UserProfile"
        project:
          $ref: "#/components/schemas/ProjectCard"

    ProjectCard:
      type: object
      required: [id, name, description, authorUsername, authorLevel]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        screenshotUrl:
          type: ["string", "null"]
        linkUrl:
          type: ["string", "null"]
        authorUsername:
          type: string
        authorLevel:
          type: ["string", "null"]

    DiscoverDeck:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverCard"

    SwipeInput:
      type: object
      required: [targetId, targetType, direction]
      properties:
        targetId:
          type: string
        targetType:
          type: string
          enum: [person, project]
        direction:
          type: string
          enum: [left, right]

    Post:
      type: object
      required: [id, authorId, content, createdAt, author]
      properties:
        id:
          type: string
        authorId:
          type: string
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        linkUrl:
          type: ["string", "null"]
        linkTitle:
          type: ["string", "null"]
        createdAt:
          type: string
        author:
          $ref: "#/components/schemas/UserProfile"

    PostInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        imageUrl:
          type: string
        linkUrl:
          type: string
        linkTitle:
          type: string

    PostPage:
      type: object
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: ["string", "null"]

    FollowStatus:
      type: object
      required: [isFollowing]
      properties:
        isFollowing:
          type: boolean
